<svg width="500" height="500" viewBox="30 30 340 389" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="canopy-hex-mono-favicon-title">
  <title id="canopy-hex-mono-favicon-title">Canopy</title>
  <!--
    Monochrome hex mark. The outline and leaf take #A3A3A3, and the three
    leaf veins are punched OUT through a mask rather than painted, so the page
    background shows through them. That is what lets this single file read as
    white on black under night and as black on white under light, with no
    second tinted copy.
  -->
  <mask id="canopy-hex-mono-favicon-veins" maskUnits="userSpaceOnUse" x="30" y="30" width="340" height="389">
    <rect x="30" y="30" width="340" height="389" fill="white"/>
    <path d="M200 170V350" stroke="black" stroke-width="14" stroke-linecap="round"/>
    <path d="M200 280L145 225" stroke="black" stroke-width="14" stroke-linecap="round"/>
    <path d="M200 250L255 195" stroke="black" stroke-width="14" stroke-linecap="round"/>
  </mask>
  <path d="M200 40L360 132.385V317.154L200 409.538L40 317.154V132.385L200 40Z" stroke="#A3A3A3" stroke-width="20" stroke-linejoin="round"/>
  <path d="M200 90C200 90 110 160 110 240C110 320 200 370 200 370C200 370 290 320 290 240C290 160 200 90 200 90Z" fill="#A3A3A3" mask="url(#canopy-hex-mono-favicon-veins)"/>
</svg>
