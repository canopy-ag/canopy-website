name: Build ingest image

# Tests and builds the demo-form ingest shim (ingest/). Pull requests run the
# tests and prove the image builds; main also publishes to GHCR. The k8s
# manifests in canopy-k8s-configs pin an immutable tag from here.
on:
  pull_request:
    paths:
      - 'ingest/**'
      - '.github/workflows/ingest-image.yml'
  push:
    branches: [main]
    paths:
      - 'ingest/**'
      - '.github/workflows/ingest-image.yml'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/canopy-ag/canopy-website-ingest

jobs:
  build:
    # GitHub-hosted on purpose: canopy-website is a PUBLIC repo, and the org's
    # self-hosted runner group does not (and must not) serve public repos, so a
    # canopy-arc-runners-* label queues forever. Hosted runners ship Docker.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image's own Node (20, see ingest/Dockerfile) runs the suite, so no
      # setup-node is involved. The shim's two deps come from the public npm
      # registry (no GitHub Packages token needed, unlike the site itself).
      - name: Test
        run: >-
          docker run --rm -v "$PWD/ingest:/app" -w /app node:20-alpine
          sh -c 'npm ci --no-audit --no-fund && npm test'

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          STAMP="$(date -u +%Y%m%d%H%M%S)"
          echo "immutable=${IMAGE}:main-${SHORT_SHA}-${STAMP}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ingest
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.tags.outputs.immutable }}
            ${{ steps.tags.outputs.latest }}

      - name: Summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Published: ${{ steps.tags.outputs.immutable }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this tag in canopy-k8s-configs/canopy-tools/canopy-website-ingest/kustomization.yaml" >> "$GITHUB_STEP_SUMMARY"
